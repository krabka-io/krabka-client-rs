[package]
name = "krabka-client-coordination"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Leader election, leases, and fencing tokens as a Kafka client API"
repository.workspace = true
documentation = "https://docs.rs/krabka-client-coordination"
readme = "README.md"
keywords = ["kafka", "coordination", "leader-election", "lease", "krabka"]
categories = ["api-bindings", "network-programming"]
# Not published: it is not one of the client libraries that other repositories
# build on. See docs/releasing.md.
publish = false

[lints]
workspace = true

[dependencies]
assert2                = { workspace = true }
krabka-client-admin = { version = "0.5.1", path = "../client-admin" }
krabka-client-core = { version = "0.5.1", path = "../client-core" }
krabka-client-producer = { version = "0.5.1", path = "../client-producer" }
krabka-protocol = { version = "0.5.0", default-features = false }
krabka-units = { workspace = true }
async-trait            = { workspace = true }
bon                    = { workspace = true }
bytes                  = { workspace = true }
thiserror              = { workspace = true }
tokio                  = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing                = { workspace = true }

[dev-dependencies]
krabka-client-core = { path = "../client-core", features = ["mock"] }
mockall            = { workspace = true }
proptest           = { workspace = true }
stateright         = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
