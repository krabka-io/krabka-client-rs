[package]
name = "krabka-client-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Subscribe-style consumer client for Apache Kafka in Rust"
repository.workspace = true
documentation = "https://docs.rs/krabka-client-consumer"
# Ship the library source with the license and notices. The tests and
# examples stay in the repository. LICENSE and NOTICE are symlinks to the
# workspace root copies.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]
readme = "README.md"
keywords = ["kafka", "consumer", "client", "streaming", "krabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[features]
default = []

[dependencies]
assert2 = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
krabka-protocol = { version = "0.5.0", default-features = false }
krabka-client-core = { version = "0.5.1", path = "../client-core" }
krabka-ids = { version = "0.5.0" }
krabka-units = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
futures-util = { workspace = true }
refined_type = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `mock` exposes MockBroker to the tests. It binds a TCP listener, so it stays
# out of the library, which also builds for `wasm32-wasip1`.
krabka-client-core = { path = "../client-core", features = ["mock"] }
krabka-client-producer = { path = "../client-producer" }
krabka-security = { version = "0.5.0" }
mutants = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
proptest = { workspace = true }
uuid = { workspace = true }
