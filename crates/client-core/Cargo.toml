[package]
name = "krabka-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Connection management and request dispatch for Apache Kafka in Rust"
repository.workspace = true
documentation = "https://docs.rs/krabka-client-core"
# Ship the library source with the license and notices. The integration tests
# and examples stay in the repository; the TLS fixtures ship because the unit
# tests in src/security/tests.rs include them at compile time. LICENSE and
# NOTICE are symlinks to the workspace root copies.
include = [
  "src/**/*",
  "/tests/fixtures/tls/*",
  "/Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]
readme = "README.md"
keywords = ["kafka", "client", "protocol", "krabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[features]
default = []
# `mock_test_support::recorded_levels` captures tracing events for tests.
mock = ["dep:tracing-subscriber"]
# SASL/GSSAPI (Kerberos) client, off by default. It turns on
# `krabka-security/gssapi`, whose Kerberos stack pulls in `rsa` 0.10
# (RUSTSEC-2023-0071, no patched release). Without it, a GSSAPI
# `SaslCredentials` fails `ConnectionOptions::validate` and the handshake with
# `UnsupportedMechanism`, and the build compiles no `rsa`.
gssapi = ["krabka-security/gssapi"]

[dependencies]
krabka-protocol = { version = "0.7.0", default-features = false }
krabka-security = { version = "0.7.0" }
krabka-ids = { version = "0.7.0" }
krabka-compression = { version = "0.7.0" }
krabka-units = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
derive_more = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "rt", "rt-multi-thread", "io-util", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
futures-util = { workspace = true }
maplit = { workspace = true }
refined_type = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
p12-keystore = { workspace = true }
pkcs8 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
x509-cert = { workspace = true }
tokio-rustls = { workspace = true }
uuid = { workspace = true }

# Reverse DNS and the platform trust store need an operating system.
# WebAssembly builds do without them: see the crate documentation.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
dns-lookup = { workspace = true }
rustls-native-certs = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crc32c = { workspace = true }
mockall = { workspace = true }
mutants = { workspace = true }
proptest = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { workspace = true }

[[test]]
name = "unit"
required-features = ["mock"]

[[test]]
name = "integration"
