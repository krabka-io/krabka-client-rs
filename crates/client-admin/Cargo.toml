[package]
name = "krabka-client-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Operator-side admin client for Krabka clusters"
repository.workspace = true
documentation = "https://docs.rs/krabka-client-admin"
# Ship the library source with the license and notices. The tests and
# examples stay in the repository. LICENSE and NOTICE are symlinks to the
# workspace root copies.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]
readme = "README.md"
keywords = ["kafka", "admin", "client", "krabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[dependencies]
assert2            = { workspace = true }
krabka-units = { workspace = true }
krabka-client-core = { version = "0.5.1", path = "../client-core" }
krabka-ids = { version = "0.5.0" }
krabka-protocol = { version = "0.5.0", default-features = false }
krabka-security = { version = "0.5.0" }
async-trait        = { workspace = true }
bytes              = { workspace = true }
futures-util       = { workspace = true }
ring               = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["sync", "time", "net"] }
tracing            = { workspace = true }
uuid               = { workspace = true }

[dev-dependencies]
krabka-client-consumer = { path = "../client-consumer" }
krabka-client-core = { path = "../client-core", features = ["mock"] }
krabka-client-producer = { path = "../client-producer" }
tempfile           = { workspace = true }
testcontainers     = { workspace = true }
testcontainers-modules = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util         = { workspace = true, features = ["codec"] }
tracing-subscriber = { workspace = true }
