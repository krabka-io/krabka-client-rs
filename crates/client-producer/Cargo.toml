[package]
name = "krabka-client-producer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Idempotent producer client for Apache Kafka in Rust"
repository.workspace = true
documentation = "https://docs.rs/krabka-client-producer"
# Ship the library source only. The tests, examples and fixtures stay in the
# repository.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]
readme = "README.md"
keywords = ["kafka", "producer", "client", "streaming", "krabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[features]
default = []

[dependencies]
assert2 = { workspace = true }
krabka-protocol = { version = "0.5.0", default-features = false }
krabka-client-core = { version = "0.5.0", path = "../client-core" }
krabka-client-consumer = { version = "0.5.0", path = "../client-consumer" }
krabka-compression = { version = "0.5.0" }
krabka-units = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
refined_type = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `mock` exposes MockBroker so the ClientTransport adapter can be tested against
# an in-process broker (no JVM).
krabka-client-admin = { path = "../client-admin" }
krabka-client-core = { path = "../client-core", features = ["mock"] }
krabka-security = { version = "0.5.0" }
mutants = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
