[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"
repository = "https://github.com/krabka-io/krabka-client-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Every lint below is an error. The groups sit at priority -1 so that the
# single lints after them take precedence. `clippy.toml` holds their settings.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Restriction lints. Clippy leaves these off by default; each one is opted in.
#
# Imports and naming.
absolute_paths = "deny"
str_to_string = "deny"
# Panics in shipped code. `clippy.toml` exempts test code.
expect_used = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
# Placeholders and debugging left behind.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Lost errors, leaks and surprising evaluation.
assertions_on_result_states = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
precedence_bits = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
try_err = "deny"
unused_result_ok = "deny"
# Shared ownership.
clone_on_ref_ptr = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
# Simpler or clearer equivalents.
as_underscore = "deny"
cfg_not_test = "deny"
doc_include_without_cfg = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
large_include_file = "deny"
map_with_unused_argument_over_ranges = "deny"
needless_raw_strings = "deny"
non_zero_suggestions = "deny"
pathbuf_init_then_push = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
string_lit_chars_any = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"

# Nursery lints, picked one by one. The whole group has too many false
# positives to enable.
branches_sharing_code = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
fallible_impl_from = "deny"
imprecise_flops = "deny"
iter_on_single_items = "deny"
literal_string_with_formatting_args = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
non_send_fields_in_send_ty = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
string_lit_as_bytes = "deny"
suboptimal_flops = "deny"
too_long_first_doc_paragraph = "deny"
trait_duplication_in_bounds = "deny"
tuple_array_conversions = "deny"
type_repetition_in_bounds = "deny"
unused_peekable = "deny"
use_self = "deny"
useless_let_if_seq = "deny"

# Cargo lints, picked one by one. The whole group also flags duplicate
# versions deep in the dependency tree, which no change here can fix.
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
async-trait = "0.1"
base64 = "0.23"
bon = "3"
bytes = "1"
derive_more = { version = "2.1.1", features = ["into"] }
crc32c = "0.6"
dashmap = "6"
# Reverse DNS for Kafka's client.dns.lookup=resolve_canonical_bootstrap_servers_only.
dns-lookup = "4"
futures = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.13"
maplit = "1"
# mockall: generate test mocks for trait seams so engine-IO decision logic is
# unit-testable (and mutation-killable) without a live broker/quorum/database.
# Dev-dependency only — `#[cfg_attr(test, mockall::automock)]` keeps it out of
# shipped builds.
mockall = "0.15"
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
# SCRAM key derivation of the SASL client.
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# PKCS#12 key stores and trust stores (Kafka ssl.keystore.type=PKCS12).
# `pbes1` reads the SHA-1 with 3DES and RC2 stores of older keytool and OpenSSL.
p12-keystore = "0.3"
# PKCS#8 private keys, with PBES2 decryption for Kafka's ssl.key.password.
pkcs8 = { version = "0.11", features = ["encryption", "pem", "sha1-insecure", "3des"] }
proptest = "1"
refined_type = "0.6"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.15", features = ["alloc"] }
# The platform trust store, which Kafka uses when ssl.truststore.location is
# not set.
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Certificate issuer names, to pick the client identity that a broker accepts.
x509-cert = { version = "0.3", default-features = false }
sha2 = "0.11"
# SHA-1 of the JKS key store format (integrity digest and key protector).
sha1 = "0.11"
# Jepsen-style exhaustive concurrency-correctness model checking (KRaft
# consensus). Dev-dependency only — never linked into a shipped binary.
# Pinned: pre-1.0, minor bumps can be breaking.
stateright = "=0.31.0"
tempfile = "3"
testcontainers = "0.28"
# The latest crates.io release still requires testcontainers 0.27, whose
# bollard-stubs version conflicts with testcontainers 0.28. Pin the upstream
# compatibility update until the next testcontainers-modules release.
testcontainers-modules = { git = "https://github.com/testcontainers/testcontainers-rs-modules-community", rev = "d69e3a09397532accea9d9e907fecc280b1513a8", features = ["kafka"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
yare = "3"
uuid = { version = "1", features = ["v4", "serde"] }

# First-party crates inherited by more than one member.
krabka-units = "0.7.0"

# Sibling repositories, pinned by revision. These crates are declared
