# Cargo settings for this workspace. CI and local builds both read this file.

# Fetch git dependencies with the system `git` client. Do not use the libgit2
# client that cargo links in.
#
# Measured in the monorepo this was split out of, on 2026-08-13 over 1000 ci
# runs (27,606 jobs): a git-dependency clone failed twice, both times inside
# libgit2's own TLS stack -- "the SSL certificate is invalid; class=Ssl (16)".
# Cargo wraps that in a generic `revision not found` / `network failure seems to
# have happened` pair, which reads like a GitHub outage. There was none: the
# same runner had cloned over HTTPS ninety seconds earlier.
#
# The system git client uses the OS CA bundle and its own transport, and does
# not share that failure. This removes one client from the path. It is not a
# retry, and it does not help if GitHub itself is unreachable.
#
# A config file rather than `CARGO_NET_GIT_FETCH_WITH_CLI` in each workflow:
# `Swatinem/rust-cache` hashes the `CARGO_*` environment into its cache key, so
# the variable costs a cold cache run per workflow that sets it, while this file
# does not. Local builds also read it, so developers get the runners' fetch path.
[net]
git-fetch-with-cli = true
