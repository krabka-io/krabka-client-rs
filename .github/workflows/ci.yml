name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the mutation sweep.
    - cron: "0 5 * * *"

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build, test, lint and format. The Aspect CLI narrows each of these to what
  # the change actually touched; `bazel build|test //...` is the equivalent for
  # anyone without the CLI, and is what the nightly job runs.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint

      - name: build
        run: aspect build //...

      - name: test
        run: aspect test //...

  # LCOV over the first-party crates. Separate from `ci` because instrumented
  # binaries are a different build, so sharing that job's cache would only
  # evict it.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - run: bazel coverage //crates/...
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: false

  # rustdoc for every crate, kept as an artifact. The `ci` job already builds
  # these -- a `rust_doc` per crate is an ordinary target -- so this exists to
  # publish the output, and to keep rendering the whole set even when `aspect
  # build` narrowed to the crates a change touched.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # The client libraries on `wasm32-wasip1`, the target of the Cluster Lab on
  # the Krabka website. Bazel builds only the native triples of MODULE.bazel,
  # so this is a Cargo job, shaped like the Cargo jobs of krabka-broker.
  #
  # The C code of `ring` and of the zstd and LZ4 codecs compiles with the
  # runner's clang and LLVM archiver against the WASI sysroot of wasi-sdk. The
  # runner image puts `clang` on PATH, but not an unversioned `llvm-ar`, so a
  # step finds the archiver that belongs to that clang. .cargo/config.toml
  # gives the target the `--cfg tokio_unstable` that tokio needs for `net` on
  # WebAssembly. A `RUSTFLAGS` variable replaces that table, so this job sets
  # none.
  #
  # Each crate is checked alone, so the features that one crate turns on
  # cannot hide an error in another.
  wasm:
    name: clippy · wasm32-wasip1
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `rust-toolchain.toml` is the single pin, so read the channel out of it
      # rather than restating it here.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: WASI sysroot
        env:
          WASI_SYSROOT_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sysroot-25.0.tar.gz
        run: |
          set -euo pipefail
          curl -LsSf --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/wasi-sysroot.tar.gz" "${WASI_SYSROOT_URL}"
          tar -xzf "${RUNNER_TEMP}/wasi-sysroot.tar.gz" -C "${RUNNER_TEMP}"
          sysroot="${RUNNER_TEMP}/wasi-sysroot-25.0"
          test -d "${sysroot}/include"
          {
            echo "CC_wasm32_wasip1=clang"
            echo "CFLAGS_wasm32_wasip1=--sysroot=${sysroot}"
          } >> "${GITHUB_ENV}"

      # `clang -print-prog-name` gives the path of the archiver that clang
      # finds for itself, or only the bare name when it finds none. For a bare
      # name, take the `llvm-ar` of the newest LLVM on the runner.
      - name: LLVM archiver
        run: |
          set -euo pipefail
          command -v clang
          ar="$(clang -print-prog-name=llvm-ar)"
          if ! command -v "${ar}" >/dev/null 2>&1; then
            ar="$(ls /usr/lib/llvm-*/bin/llvm-ar | sort -V | tail -n 1)"
          fi
          "${ar}" --version
          echo "AR_wasm32_wasip1=${ar}" >> "${GITHUB_ENV}"

      - name: clippy
        run: |
          set -euo pipefail
          for crate in \
            krabka-client-core \
            krabka-client-consumer \
            krabka-client-producer \
            krabka-client-admin \
            krabka-client-coordination; do
            cargo clippy --locked --target wasm32-wasip1 -p "${crate}" --lib -- -D warnings
          done

  # A mutation sweep rebuilds and re-runs a crate's unit tests once per mutant,
  # so it is far too slow to gate a pull request.
  #
  # `continue-on-error`: survivors are the expected state, not an exception --
  # `cargo_mutants_test` runs only `#[cfg(test)]` unit tests, so every mutant the
  # `tests/*.rs` suites would have killed is reported as one. The job exists to
  # produce a list to read. Make it blocking once the score is worth defending.
  mutants:
    name: mutation sweep
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - id: targets
        run: |
          {
            echo 'targets<<EOF'
            bazel query 'kind("cargo_mutants_test rule", //crates/...)'
            echo EOF
          } >>"${GITHUB_OUTPUT}"
      - run: bazel test ${{ steps.targets.outputs.targets }}
